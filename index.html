<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08080f">
  <meta name="description" content="Segurança Sus - acompanhe minhas aventuras no YouTube e TikTok">
  <title>Segurança Sus</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      font-family: Arial, Helvetica, sans-serif;
      color: #fff;
      background:
        radial-gradient(circle at 20% 0%, rgba(145,70,255,.28), transparent 35%),
        radial-gradient(circle at 100% 100%, rgba(255,0,80,.20), transparent 35%),
        linear-gradient(145deg, #12121d, #050508 70%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 28px 16px;
      overflow-x: hidden;
    }

    .container {
      width: 100%;
      max-width: 440px;
      text-align: center;
      animation: enter .7s ease both;
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .logo {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 50%;
      margin: 0 auto 18px;
      border: 3px solid #ff183f;
      box-shadow: 0 0 35px rgba(255, 24, 63, .35);
      background: #111;
    }

    h1 {
      font-size: 30px;
      font-weight: 900;
      letter-spacing: .5px;
      margin-bottom: 9px;
    }

    .description {
      color: #c2c2ce;
      font-size: 15px;
      line-height: 1.55;
      margin-bottom: 28px;
    }

    .section-title {
      color: #8f8f9d;
      font-size: 12px;
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-bottom: 13px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 13px;
    }

    .link {
      min-height: 70px;
      display: flex;
      align-items: center;
      padding: 11px 17px;
      color: #fff;
      text-decoration: none;
      border-radius: 19px;
      background: rgba(255,255,255,.075);
      border: 1px solid rgba(255,255,255,.11);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform .2s ease, background .2s ease, box-shadow .2s ease;
    }

    .link:hover {
      transform: translateY(-3px);
      background: rgba(255,255,255,.12);
    }

    .link:active { transform: scale(.97); }

    .icon {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
      margin-right: 14px;
      font-size: 22px;
      font-weight: 900;
    }

    .youtube .icon {
      background: #ff0033;
      box-shadow: 0 7px 22px rgba(255,0,51,.25);
    }

    .tiktok .icon {
      background: #111;
      border: 1px solid #444;
    }

    .text {
      flex: 1;
      text-align: left;
    }

    .text strong {
      display: block;
      font-size: 16px;
      margin-bottom: 4px;
    }

    .text span {
      display: block;
      color: #a7a7b4;
      font-size: 12px;
    }

    .arrow {
      color: #aaa;
      font-size: 25px;
      transition: transform .2s ease;
    }

    .link:hover .arrow { transform: translateX(5px); }

    footer {
      margin-top: 27px;
      color: #686875;
      font-size: 11px;
    }

    @media (max-width: 360px) {
      .logo { width: 125px; height: 125px; }
      h1 { font-size: 26px; }
    }
  </style>
</head>

<body>
  <main class="container">
    <img class="logo" src="logo.png" alt="Logo Segurança Sus">

    <h1>Segurança Sus</h1>

    <p class="description">
      🚨 O impostor está entre nós!<br>
      🎮 Acompanhe minhas aventuras no YouTube e TikTok 👇
    </p>

    <div class="section-title">Minhas redes</div>

    <section class="links">
      <a class="link youtube"
         href="https://www.youtube.com/@Seguran%C3%A7a_sus"
         target="_blank"
         rel="noopener noreferrer">
        <div class="icon">▶</div>
        <div class="text">
          <strong>YouTube</strong>
          <span>Inscreva-se no meu canal</span>
        </div>
        <div class="arrow">›</div>
      </a>

      <a class="link tiktok"
         href="https://www.tiktok.com/@seguranca_sus"
         target="_blank"
         rel="noopener noreferrer">
        <div class="icon">♪</div>
        <div class="text">
          <strong>TikTok</strong>
          <span>Siga @seguranca_sus</span>
        </div>
        <div class="arrow">›</div>
      </a>
    </section>

    <footer>© 2026 • Segurança Sus</footer>
  </main>
</body>
</html>
